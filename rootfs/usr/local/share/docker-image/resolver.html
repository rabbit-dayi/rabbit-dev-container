<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rabbit Dev Container | DNS 设置</title>
  <style>
    :root { color: #172324; background: #edf2f0; font-family: system-ui, -apple-system, sans-serif; }
    * { box-sizing: border-box; }
    body { min-height: 100vh; margin: 0; padding: 24px; }
    main { width: min(100%, 760px); margin: 0 auto; }
    header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin-bottom: 24px; }
    .eyebrow { margin: 0 0 8px; color: #157a6e; font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; }
    h1, h2, p { margin-top: 0; }
    h1 { margin-bottom: 0; font-size: 30px; }
    h2 { margin-bottom: 14px; font-size: 17px; }
    a { color: #157a6e; font-weight: 700; text-decoration: none; }
    a:hover, a:focus-visible { text-decoration: underline; }
    .panel { margin-bottom: 14px; padding: 20px; border: 1px solid #c9d5d1; border-radius: 8px; background: #ffffff; }
    .source { margin-bottom: 14px; padding: 12px 14px; border-left: 3px solid #157a6e; background: #e3efec; color: #35514b; }
    .source.warning { border-left-color: #c17b2e; background: #fff3df; color: #6d4a20; }
    .fields { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
    label { display: grid; gap: 7px; color: #40534f; font-size: 13px; font-weight: 700; }
    input[type="text"] { width: 100%; min-height: 42px; padding: 9px 11px; border: 1px solid #b8c9c4; border-radius: 6px; color: #172324; background: #fbfdfc; font: inherit; font-family: ui-monospace, monospace; font-weight: 400; }
    input[type="text"]:focus { border-color: #157a6e; outline: 2px solid #b5ded7; }
    input[type="text"]:disabled { color: #71807c; background: #eef2f0; cursor: not-allowed; }
    .toggle { display: flex; align-items: center; gap: 9px; min-height: 42px; color: #40534f; font-size: 14px; font-weight: 650; }
    .toggle input { width: 17px; height: 17px; accent-color: #157a6e; }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 20px; }
    button { min-height: 42px; padding: 9px 15px; border: 1px solid #157a6e; border-radius: 6px; color: #ffffff; background: #157a6e; font: inherit; font-weight: 700; cursor: pointer; }
    button.secondary { color: #157a6e; background: #ffffff; }
    button:hover, button:focus-visible { background: #0f6259; outline: 2px solid #b5ded7; outline-offset: 2px; }
    button.secondary:hover, button.secondary:focus-visible { color: #0f6259; background: #eef8f5; }
    button:disabled { opacity: .6; cursor: wait; }
    .result { min-height: 24px; margin: 0; color: #51605d; white-space: pre-wrap; overflow-wrap: anywhere; }
    .result.error { color: #b3473c; }
    .checks { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; margin-top: 14px; }
    .check { padding: 12px; border: 1px solid #e0e7e4; border-radius: 6px; }
    .check strong, .check span { display: block; }
    .check span { margin-top: 5px; color: #697572; font-family: ui-monospace, monospace; font-size: 12px; overflow-wrap: anywhere; }
    .check.ok { border-color: #9bcbbd; background: #f0faf6; }
    .check.fail { border-color: #e4b1a9; background: #fff7f5; }
    .meta { margin: 0; color: #697572; font-size: 12px; }
    .hint { margin: -4px 0 16px; color: #697572; font-size: 13px; line-height: 1.5; }
    .tunnel-status { min-height: 24px; margin: 16px 0 0; color: #51605d; overflow-wrap: anywhere; }
    .tunnel-status.error { color: #b3473c; }
    button.small { min-height: 34px; padding: 6px 12px; font-size: 13px; }
    .tunnel-list { display: grid; gap: 10px; margin-top: 14px; }
    .tunnel-item { padding: 14px; border: 1px solid #e0e7e4; border-radius: 6px; }
    .tunnel-item.crashed { border-color: #e4b1a9; background: #fff7f5; }
    .tunnel-item-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
    .tunnel-target { font-family: ui-monospace, monospace; font-size: 13px; overflow-wrap: anywhere; }
    .tunnel-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 700; text-transform: uppercase; white-space: nowrap; }
    .tunnel-badge::before { width: 8px; height: 8px; border-radius: 50%; background: #85918e; content: ''; }
    .tunnel-badge.up { color: #16734e; }
    .tunnel-badge.up::before { background: #1ca66f; }
    .tunnel-badge.down { color: #b3473c; }
    .tunnel-badge.down::before { background: #d45b4c; }
    .tunnel-link { display: block; margin-top: 8px; font-family: ui-monospace, monospace; font-size: 13px; overflow-wrap: anywhere; }
    .tunnel-error { margin: 6px 0 0; color: #b3473c; font-size: 13px; overflow-wrap: anywhere; }
    .tunnel-empty { margin: 14px 0 0; color: #697572; }
    @media (max-width: 560px) { body { padding: 16px; } header { align-items: flex-start; flex-direction: column; gap: 10px; } .fields, .checks { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <main>
    <header>
      <div><p class="eyebrow">Rabbit Dev Container 🐰</p><h1>DNS 设置</h1></div>
      <a href="/services/">返回服务</a>
    </header>
    <div id="source" class="source">正在读取配置...</div>
    <section class="panel">
      <h2>解析器配置</h2>
      <form id="resolver-form">
        <div class="fields">
          <label>本地 DNS（IPv4）<input id="local_nameserver" name="local_nameserver" type="text" inputmode="decimal" autocomplete="off" required></label>
          <label>备用 DNS（IPv4）<input id="fallback_nameserver" name="fallback_nameserver" type="text" inputmode="decimal" autocomplete="off" required></label>
          <label>测试域名<input id="check_domain" name="check_domain" type="text" autocomplete="off" required></label>
          <div class="toggle"><input id="auto_config" name="auto_config" type="checkbox"><span>启动时自动配置 DNS</span></div>
          <div class="toggle"><input id="fallback_always" name="fallback_always" type="checkbox"><span>本地 DNS 不响应时仍尝试备用 DNS</span></div>
        </div>
        <div class="actions">
          <button id="test" class="secondary" type="button">测试 DNS</button>
          <button id="save" type="submit">保存并应用</button>
        </div>
      </form>
    </section>
    <section class="panel">
      <h2>测试结果</h2>
      <p id="result" class="result">尚未测试。</p>
      <div id="checks" class="checks" aria-live="polite"></div>
      <p id="meta" class="meta"></p>
    </section>
    <section class="panel">
      <h2>Cloudflare 临时隧道</h2>
      <p class="hint">把容器内的 HTTP 服务临时映射到公网测试。每个内部地址各自对应一条独立隧道，可以同时新建多条；隧道只在当前容器运行期间存在，地址会随机变化，不写入持久化配置。也可以先查看 <a href="https://try.cloudflare.com/" target="_blank" rel="noreferrer">try.cloudflare.com</a>。</p>
      <label>内部服务地址<input id="tunnel-target" type="text" inputmode="url" autocomplete="off" placeholder="127.0.0.1:8080"></label>
      <div class="actions">
        <button id="tunnel-start" type="button">新建隧道</button>
      </div>
      <p id="tunnel-status" class="tunnel-status" aria-live="polite">正在读取隧道状态...</p>
      <div id="tunnel-list" class="tunnel-list" aria-live="polite"></div>
    </section>
  </main>
  <script>
    const form = document.getElementById('resolver-form');
    const source = document.getElementById('source');
    const result = document.getElementById('result');
    const checks = document.getElementById('checks');
    const meta = document.getElementById('meta');
    const resolverButtons = [...document.querySelectorAll('#resolver-form button')];
    const fields = ['local_nameserver', 'fallback_nameserver', 'check_domain'];
    const labels = { local: '本地 DNS', fallback: '备用 DNS' };
    let statePath = '/root/.rabbit_container/resolver.json';
    let tunnelTimer;
    const tunnelBusyIds = new Set();
    const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (char) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char]));

    function configFromForm() {
      return {
        auto_config: document.getElementById('auto_config').checked,
        local_nameserver: document.getElementById('local_nameserver').value.trim(),
        fallback_nameserver: document.getElementById('fallback_nameserver').value.trim(),
        fallback_always: document.getElementById('fallback_always').checked,
        check_domain: document.getElementById('check_domain').value.trim(),
      };
    }

    function fill(config, locked = {}) {
      fields.forEach((key) => {
        const input = document.getElementById(key);
        input.value = config[key] || '';
        input.disabled = Boolean(locked[key]);
      });
      document.getElementById('auto_config').checked = Boolean(config.auto_config);
      document.getElementById('auto_config').disabled = Boolean(locked.auto_config);
      document.getElementById('fallback_always').checked = Boolean(config.fallback_always);
      document.getElementById('fallback_always').disabled = Boolean(locked.fallback_always);
    }

    function setBusy(busy) { resolverButtons.forEach((button) => { button.disabled = busy; }); }
    function setMessage(message, error = false) { result.textContent = message; result.className = `result${error ? ' error' : ''}`; }

    function renderChecks(data) {
      const entries = Object.entries(data || {});
      checks.innerHTML = entries.map(([key, item]) => `<div class="check ${item.ok ? 'ok' : 'fail'}"><strong>${labels[key] || key}: ${item.ok ? '可用' : '不可用'}</strong><span>${item.ok ? (item.addresses || []).join(', ') : (item.error || 'no response')}</span></div>`).join('');
    }

    async function call(path, body = {}) {
      const response = await fetch(`/dns/api/${path}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      return payload;
    }

    async function get(path) {
      const response = await fetch(`/dns/api/${path}`, { cache: 'no-store' });
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      return payload;
    }

    document.getElementById('test').addEventListener('click', async () => {
      setBusy(true); setMessage('正在测试 DNS...');
      try { const payload = await call('resolver/test', configFromForm()); renderChecks(payload.results); setMessage('测试完成。'); }
      catch (error) { setMessage(error.message, true); }
      finally { setBusy(false); }
    });

    form.addEventListener('submit', async (event) => {
      event.preventDefault(); setBusy(true); setMessage('正在保存并应用...');
      try {
        const payload = await call('resolver/apply', configFromForm());
        setMessage(payload.output || '配置已保存并应用。');
        meta.textContent = `持久化位置：${statePath}`;
      } catch (error) { setMessage(error.message, true); }
      finally { setBusy(false); }
    });

    function tunnelBadge(item) {
      if (item.running) return { cls: 'up', text: '运行中' };
      if (item.crashed) return { cls: 'down', text: '已断开' };
      return { cls: 'down', text: '已停止' };
    }

    function renderTunnels(payload) {
      const target = document.getElementById('tunnel-target');
      const status = document.getElementById('tunnel-status');
      const list = document.getElementById('tunnel-list');
      const items = payload.tunnels || [];
      if (!target.value && payload.default_target) target.value = payload.default_target;

      status.className = 'tunnel-status';
      status.textContent = items.length ? `当前 ${items.length} 条隧道。` : '当前没有运行中的隧道。';

      if (!items.length) {
        list.innerHTML = '<p class="tunnel-empty">填写内部服务地址后点击“新建隧道”，可以同时新建多条。</p>';
        return;
      }

      list.innerHTML = items.map((item) => {
        const badge = tunnelBadge(item);
        const busy = tunnelBusyIds.has(item.id);
        return `
          <article class="tunnel-item${item.crashed ? ' crashed' : ''}">
            <div class="tunnel-item-header">
              <span class="tunnel-target">${escapeHtml(item.target)}</span>
              <span class="tunnel-badge ${badge.cls}">${badge.text}</span>
            </div>
            ${item.url ? `<a class="tunnel-link" href="${escapeHtml(item.url)}" target="_blank" rel="noreferrer">${escapeHtml(item.url)}</a>` : ''}
            ${item.last_error ? `<p class="tunnel-error">${escapeHtml(item.last_error)}</p>` : ''}
            <div class="actions">
              <button type="button" class="secondary small tunnel-stop" data-id="${escapeHtml(item.id)}"${busy ? ' disabled' : ''}>${item.running ? '停止' : '移除'}</button>
            </div>
          </article>
        `;
      }).join('');

      list.querySelectorAll('.tunnel-stop').forEach((button) => {
        button.addEventListener('click', () => stopOneTunnel(button.dataset.id));
      });
    }

    async function refreshTunnels() {
      clearTimeout(tunnelTimer);
      try {
        const payload = await get('tunnel');
        renderTunnels(payload);
        const anyRunning = (payload.tunnels || []).some((item) => item.running);
        tunnelTimer = setTimeout(refreshTunnels, anyRunning ? 2000 : 5000);
      } catch (error) {
        document.getElementById('tunnel-status').textContent = error.message;
        document.getElementById('tunnel-status').className = 'tunnel-status error';
        tunnelTimer = setTimeout(refreshTunnels, 5000);
      }
    }

    document.getElementById('tunnel-start').addEventListener('click', async () => {
      const button = document.getElementById('tunnel-start');
      const status = document.getElementById('tunnel-status');
      button.disabled = true;
      status.className = 'tunnel-status';
      status.textContent = '正在连接 Cloudflare...';
      try {
        await call('tunnel/start', { target: document.getElementById('tunnel-target').value.trim() });
        await refreshTunnels();
      } catch (error) {
        status.textContent = error.message;
        status.className = 'tunnel-status error';
      } finally {
        button.disabled = false;
      }
    });

    async function stopOneTunnel(id) {
      tunnelBusyIds.add(id);
      try {
        await call('tunnel/stop', { id });
      } catch (error) {
        document.getElementById('tunnel-status').textContent = error.message;
        document.getElementById('tunnel-status').className = 'tunnel-status error';
      } finally {
        tunnelBusyIds.delete(id);
        await refreshTunnels();
      }
    }

    fetch('/dns/api/resolver', { cache: 'no-store' }).then(async (response) => {
      const payload = await response.json();
      if (!response.ok) throw new Error(payload.error || `HTTP ${response.status}`);
      fill(payload.config, payload.locked);
      statePath = payload.state_file || statePath;
      const locked = Object.keys(payload.locked || {});
      if (locked.length) {
        source.textContent = `部分配置由环境变量控制：${locked.join(', ')}。页面保存的值将在移除对应环境变量后生效。`;
        source.className = 'source warning';
      } else {
        source.textContent = payload.stored ? '当前配置来自 /root/.rabbit_container 持久化文件，可以在此测试和修改。' : '当前使用默认配置，可以在此测试和保存。';
      }
      meta.textContent = payload.password_protected ? `此页面使用 Basic Auth 保护；持久化位置：${statePath}` : '当前显式启用了无认证模式，请勿将此页面直接暴露到公网。';
    }).catch((error) => { source.textContent = error.message; source.className = 'source warning'; });
    refreshTunnels();
  </script>
</body>
</html>
